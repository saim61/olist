services:
  postgres:
    image: postgres:17-alpine
    container_name: olist_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, on first boot only, in filename order.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      # Mounted read-only so the server can COPY the CSVs directly.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-olist} -d $${POSTGRES_DB:-olist}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
